<script>
"use strict";
/* ============================================================
   Settings (from the product plan)
   ============================================================ */
const CFG = {
  dailyRightSwipes: 25,
  paidSwipesPerPost: 30,
  rewardPhp: 20,
  postPriceUsd: 40,
  hideCompanyDays: 30,
  minCashout: 200,
};
const FREE_MAIL = ["gmail.com","yahoo.com","yahoo.com.ph","outlook.com","hotmail.com","live.com","icloud.com","proton.me","protonmail.com","aol.com","gmx.com","mail.com","ymail.com"];
const COLLECTIONS = ["seekers","companies","jobs","swipes","hidden","matches","messages","rewards","payouts"];

/* ============================================================
   Rule-based resume reader and search parser (no AI, no cost)
   ============================================================ */
const SKILLS = {
  PHP: [], Laravel: [], Symfony: [], CodeIgniter: [], WordPress: ["wp"],
  JavaScript: ["js","ecmascript"], TypeScript: ["ts"], "Node.js": ["node","nodejs"],
  React: ["react.js","reactjs"], "Next.js": ["nextjs"], Vue: ["vue.js","vuejs"], Angular: ["angularjs"],
  "React Native": [], Flutter: [], Dart: [], Swift: [], Kotlin: [], Java: [], "Spring Boot": ["spring"],
  Python: [], Django: [], Flask: [], FastAPI: [], Ruby: [], Rails: ["ruby on rails"], Go: ["golang"],
  Rust: [], "C#": ["c sharp"], ".NET": ["dotnet","asp.net"], "C++": ["cpp"],
  HTML: ["html5"], CSS: ["css3"], Tailwind: ["tailwindcss"], Sass: ["scss"],
  SQL: [], MySQL: [], PostgreSQL: ["postgres"], MongoDB: ["mongo"], Redis: [], Firebase: [], Supabase: [],
  GraphQL: [], "REST API": ["rest","restful","rest apis"],
  AWS: ["amazon web services"], Azure: [], GCP: ["google cloud"], Docker: [], Kubernetes: ["k8s"],
  Linux: [], Git: ["github","gitlab"], "CI/CD": ["ci cd","jenkins","github actions"], DevOps: [], Terraform: [],
  Selenium: [], Cypress: [], Playwright: [], Jest: [], QA: ["quality assurance","software testing","manual testing"],
  "UI/UX": ["ui design","ux design","user experience","ux"], Figma: [], Photoshop: [], Illustrator: [],
  "Data Analysis": ["data analytics"], Excel: ["ms excel","microsoft excel"], "Power BI": ["powerbi"], Tableau: [],
  "Machine Learning": ["ml"], SEO: [], "Digital Marketing": [], "Social Media": ["social media marketing"],
  "Customer Service": ["customer support","call center","bpo"], Sales: [], Accounting: ["bookkeeping"],
  "Virtual Assistant": ["virtual assistance"], Copywriting: ["content writing"],
  "Project Management": [], Management: ["team lead","team leader","leadership","people management","managed a team","led a team"],
  Agile: ["scrum","kanban"], Jira: [], Salesforce: [], Shopify: [],
};
const LANGS = ["english","filipino","tagalog","cebuano","bisaya","ilocano","spanish","japanese","korean","mandarin","chinese","cantonese","french","german","arabic","hindi","indonesian","malay","vietnamese","thai","portuguese","italian","russian"];
const COUNTRIES = { philippines:"PH", manila:"PH", "metro manila":"PH", cebu:"PH", davao:"PH", "quezon city":"PH", makati:"PH", taguig:"PH", pasig:"PH", bgc:"PH", singapore:"SG", "united states":"US", usa:"US", "united kingdom":"GB", uk:"GB", australia:"AU", canada:"CA", japan:"JP", "hong kong":"HK", "united arab emirates":"AE", dubai:"AE", "saudi arabia":"SA", malaysia:"MY", indonesia:"ID", vietnam:"VN", thailand:"TH", india:"IN" };
const ROLES = ["programmer","developer","engineer","designer","analyst","tester","qa","manager","lead","architect","administrator","assistant","accountant","writer","marketer","specialist","consultant","agent","representative","scientist","devops"];
const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const SKILL_RE = Object.entries(SKILLS).map(([label, aliases]) => {
  const names = [label, ...aliases].map((n) => esc(n.toLowerCase())).sort((a, b) => b.length - a.length);
  return [label, new RegExp(`(?<![a-z0-9+#.])(?:${names.join("|")})(?![a-z0-9+#])`, "i")];
});
const skillRe = (label) => (SKILL_RE.find(([l]) => l === label) || [])[1];
function findSkills(t) { return SKILL_RE.filter(([, re]) => re.test(t)).map(([l]) => l); }
function findLangs(t) {
  t = t.toLowerCase();
  return [...new Set(LANGS.filter((l) => new RegExp(`\\b${l}\\b`).test(t)).map((l) => (l === "tagalog" ? "filipino" : l)))];
}
function findCountry(t) {
  t = t.toLowerCase(); let best = null;
  for (const [n, c] of Object.entries(COUNTRIES)) { const at = t.search(new RegExp(`\\b${esc(n)}\\b`)); if (at >= 0 && (!best || at < best.at)) best = { c, at }; }
  return best ? best.c : "";
}
const MONTHS = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, sept:8, oct:9, nov:10, dec:11 };
const MONTH = "(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\\.?";
const POINT = `(?:${MONTH}\\s*)?((?:19|20)\\d{2})|(?:(\\d{1,2})/((?:19|20)\\d{2}))`;
const RANGE = new RegExp(`(?:${POINT})\\s*(?:-|–|—|to|until)\\s*(?:(present|current|now|to date)|(?:${POINT}))`, "gi");
function rangeOf(m, now) {
  const start = m[2] ? +m[2] + (m[1] ? MONTHS[m[1].slice(0,3).toLowerCase()] : 0) / 12 : +m[4] + (+m[3] - 1) / 12;
  let end;
  if (m[5]) end = now.getFullYear() + now.getMonth() / 12;
  else if (m[7]) end = +m[7] + (m[6] ? MONTHS[m[6].slice(0,3).toLowerCase()] : 11) / 12;
  else end = +m[9] + (+m[8] - 1) / 12;
  return end > start ? { start, end } : null;
}
function blocksOf(text, now) {
  const ms = [...text.matchAll(RANGE)]; const out = [];
  ms.forEach((m, i) => {
    const r = rangeOf(m, now); if (!r) return;
    const from = m.index, to = i + 1 < ms.length ? ms[i + 1].index : Math.min(text.length, from + 2500);
    const ls = text.lastIndexOf("\n", from - 1), pls = text.lastIndexOf("\n", ls - 1);
    const same = text.slice(ls + 1, from).replace(/[|,–—-]+\s*$/, "").trim(), prev = text.slice(pls + 1, ls).trim();
    out.push({ ...r, text: text.slice(Math.max(0, pls), to), title: (same.length > 2 ? same : prev).slice(0, 80) });
  });
  return out;
}
function mergedYears(bs) {
  const s = [...bs].sort((a, b) => a.start - b.start); let total = 0, cs = -1, ce = -1;
  for (const b of s) { if (b.start > ce) { if (ce > cs) total += ce - cs; cs = b.start; ce = b.end; } else ce = Math.max(ce, b.end); }
  if (ce > cs) total += ce - cs; return total;
}
const half = (n) => Math.round(n * 2) / 2;
function stripContacts(t) {
  return t.replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g, "[email hidden]")
    .replace(/(?:\+?63|0)\s*9\d{2}[\s-]?\d{3}[\s-]?\d{4}/g, "[phone hidden]")
    .replace(/\+?\d[\d\s().-]{8,}\d/g, "[phone hidden]");
}
function readResume(raw, now = new Date()) {
  const text = raw.replace(/\r/g, "").replace(/[ \t]+/g, " ");
  const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
  const bs = blocksOf(text, now);
  const skills = findSkills(text).map((label) => ({ label, years: half(mergedYears(bs.filter((b) => skillRe(label).test(b.text)))) }))
    .sort((a, b) => b.years - a.years);
  let first = "", last = "";
  for (const line of lines.slice(0, 8)) {
    const clean = line.replace(/[^A-Za-zÀ-ÿñÑ .'-]/g, "").trim(); const w = clean.split(/\s+/).filter(Boolean);
    if (w.length >= 2 && w.length <= 5 && !/resume|curriculum|vitae|profile|contact/i.test(clean) && w.every((x) => /^[A-ZÀ-ÿÑ]/.test(x) || x.length <= 3)) {
      const p = w.map((x) => x[0] + x.slice(1).toLowerCase()); first = p.slice(0, -1).join(" "); last = p[p.length - 1]; break;
    }
  }
  const roleRe = new RegExp(`\\b(${ROLES.join("|")})\\b`, "i");
  const headline = lines.slice(1, 6).find((l) => roleRe.test(l) && l.length < 60) || ([...bs].sort((a, b) => b.end - a.end)[0] || {}).title || "";
  const sal = text.toLowerCase().replace(/,/g, "").match(/(?:expected|desired|asking)\s*(?:monthly\s*)?salary[^0-9]{0,20}(\d+(?:\.\d+)?)\s*(k)?(?:\s*(?:-|–|to)\s*(?:php|₱|p)?\s*(\d+(?:\.\d+)?)\s*(k)?)?/);
  const v = (n, k) => (n ? Math.round(+n * (k ? 1000 : 1)) : "");
  return {
    first, last, headline, totalYears: half(mergedYears(bs)), skills,
    recentRoles: [...bs].sort((a, b) => b.end - a.end).slice(0, 4).map((b) => ({ title: b.title, years: half(b.end - b.start) })),
    salaryMin: sal ? v(sal[1], sal[2]) : "", salaryMax: sal ? (v(sal[3], sal[4]) || v(sal[1], sal[2])) : "",
    country: findCountry(text) || "PH", languages: findLangs(text), resumeText: stripContacts(text).trim(),
  };
}
function parseSearch(query) {
  const q = query.toLowerCase(); const found = findSkills(q);
  const nums = [...q.matchAll(/(\d+(?:\.\d+)?)\s*\+?\s*(?:years?|yrs?)/g)].map((m) => ({ n: +m[1], at: m.index }));
  const skills = found.map((label) => {
    if (!nums.length) return { label, min: 0 };
    if (nums.length === 1) return { label, min: nums[0].n };
    const p = q.search(skillRe(label));
    return { label, min: nums.reduce((a, b) => (Math.abs(b.at - p) < Math.abs(a.at - p) ? b : a)).n };
  });
  const role = (q.match(new RegExp(`\\b(${ROLES.join("|")})s?\\b`, "i")) || [])[1] || null;
  const sal = q.replace(/,/g, "").match(/(\d+(?:\.\d+)?)\s*(k)\s*\+?|(?:php|₱)\s*(\d{4,})/);
  return {
    role, skills, country: findCountry(q) || null, remote: /\bremote\b|work from home|\bwfh\b/.test(q) || null,
    salaryMin: sal ? Math.round(+(sal[1] || sal[3]) * (sal[2] ? 1000 : 1)) : null, languages: findLangs(q),

async function pdfText(file) {

const now = () => Date.now();
const DAY = 86400000;
const php = (n) => "PHP " + Number(n || 0).toLocaleString("en-PH");
const me = () => D.seekers[S.uid];
const myCompany = () => D.companies[S.uid];
const swipeId = (side, seekerId, jobId) => `${side}_${seekerId}_${jobId}`;
const matchId = (jobId, seekerId) => `${jobId}_${seekerId}`;
const sw = (side, seekerId, jobId) => D.swipes[swipeId(side, seekerId, jobId)];
function mask(first, last) {
  const m = (s) => (s ? s[0].toUpperCase() + "*".repeat(Math.max(3, s.length - 1)) : "");
  return [m(first), m(last)].filter(Boolean).join(" ") || "A*** ****";
}
function overlap(aMin, aMax, bMin, bMax) {
  return (+aMin || 0) <= (+bMax || Infinity) && (+bMin || 0) <= (+aMax || Infinity);
}
function passes(s, j) {
  if (!overlap(s.salaryMin, s.salaryMax, j.salaryMin, j.salaryMax)) return false;
  const placeOk = (j.remote && s.remote !== false) || (s.country || "") === (j.country || "") || (s.relocate && j.relocation);
  if (!placeOk) return false;
  return (j.languages || []).every((l) => (s.languages || []).includes(l));
}
function yearsFor(s, label) { const k = (s.skills || []).find((x) => x.label.toLowerCase() === label.toLowerCase()); return k ? +k.years : 0; }
function score(s, j) {
  const req = j.skills || []; if (!req.length) return 1;
  return req.reduce((sum, r) => sum + Math.min(yearsFor(s, r.label) / Math.max(+r.min || 0.5, 0.5), 1), 0) / req.length;
}
function whyLine(s, j) {
  const parts = (j.skills || []).map((r) => { const y = yearsFor(s, r.label); return `${r.label} ${y} yrs ${y >= +r.min ? "✓" : "~"}`; });
  if (overlap(s.salaryMin, s.salaryMax, j.salaryMin, j.salaryMax)) parts.push("Salary in range ✓");
  return parts.join(" · ");
}
// "programmer" should find developers and engineers too
const ROLE_GROUPS = [["programmer","developer","engineer","coder","dev"], ["designer","ui","ux"], ["tester","qa"], ["manager","lead","head","supervisor"], ["assistant","va"], ["analyst","scientist"], ["writer","copywriter"], ["agent","representative","specialist"]];
function roleMatches(headline, role) {
  if (!role) return true; const hl = (headline || "").toLowerCase();
  const group = ROLE_GROUPS.find((g) => g.includes(role)) || [role];
  return group.some((w) => new RegExp(`\\b${w}`).test(hl));
}
function isHidden(seekerId, companyId) { const h = D.hidden[`${seekerId}_${companyId}`]; return h && h.until > now(); }
function rightSwipesToday(seekerId) {
  return Object.values(D.swipes).filter((x) => x.side === "seeker" && x.seekerId === seekerId && x.dir === "right" && x.at > now() - DAY).length;
}
function balanceOf(seekerId) {
  const earned = Object.values(D.rewards).filter((r) => r.seekerId === seekerId).reduce((a, r) => a + r.amount, 0);
  const out = Object.values(D.payouts).filter((p) => p.seekerId === seekerId && p.status !== "rejected").reduce((a, p) => a + p.amount, 0);
  return earned - out;
}
function rewardUsed(jobId) { return Object.values(D.rewards).filter((r) => r.jobId === jobId).length; }
function seekerFeed() {
  const s = me(); if (!s) return [];
  return Object.entries(D.jobs).map(([id, j]) => ({ id, ...j }))
    .filter((j) => j.paid && !sw("seeker", S.uid, j.id))
    .filter((j) => (sw("company", S.uid, j.id) || {}).dir !== "left")
    .filter((j) => !isHidden(S.uid, j.companyId))
    .filter((j) => passes(s, j))
    .sort((a, b) => score(s, b) - score(s, a) || (b.createdAt || 0) - (a.createdAt || 0));
}
function candidates(jobId, filters) {
  const j = D.jobs[jobId]; if (!j) return [];
  return Object.entries(D.seekers).map(([id, s]) => ({ id, ...s }))
    .filter((s) => s.confirmed)
    .filter((s) => !sw("company", s.id, jobId))
    .filter((s) => (sw("seeker", s.id, jobId) || {}).dir !== "left")
    .filter((s) => !isHidden(s.id, j.companyId))
    .filter((s) => passes(s, j))
    .filter((s) => roleMatches(s.headline, filters.role))
    .filter((s) => filters.skills.every((k) => (s.skills || []).some((x) => x.label.toLowerCase() === k.label.toLowerCase())))
    .map((s) => ({ ...s, _score: score(s, j) + (filters.skills.length ? filters.skills.reduce((a, k) => a + Math.min(yearsFor(s, k.label) / Math.max(k.min, 0.5), 1), 0) / filters.skills.length : 0) }))
    .sort((a, b) => b._score - a._score);
}

async function maybeMatch(jobId, seekerId) {
  if ((sw("seeker", seekerId, jobId) || {}).dir === "right" && (sw("company", seekerId, jobId) || {}).dir === "right" && !D.matches[matchId(jobId, seekerId)]) {
    await put("matches", matchId(jobId, seekerId), { jobId, seekerId, at: now() });
    const j = D.jobs[jobId];
    if (seekerId === S.uid || (j && j.companyId === S.uid)) showMatch(jobId, seekerId);
  }
}
async function companyRight(jobId, seekerId) {
  await put("swipes", swipeId("company", seekerId, jobId), { side: "company", seekerId, jobId, dir: "right", at: now() });
  const s = D.seekers[seekerId], j = D.jobs[jobId];
  const rid = `${seekerId}_${jobId}`;
  if (s && s.verification === "verified" && j && j.paid && rewardUsed(jobId) < CFG.paidSwipesPerPost && !D.rewards[rid]) {
    await put("rewards", rid, { seekerId, jobId, amount: CFG.rewardPhp, at: now() });
  }
}
async function seekerSwipe(job, dir) {
  if (dir === "right" && rightSwipesToday(S.uid) >= CFG.dailyRightSwipes) return `You've used today's ${CFG.dailyRightSwipes} right swipes. Left swipes still work.`;
  await put("swipes", swipeId("seeker", S.uid, job.id), { side: "seeker", seekerId: S.uid, jobId: job.id, dir, at: now() });
  if (dir === "right") {
    // Sample companies answer instantly so you can see a match.
    if (job.sample && job.autoLike && !sw("company", S.uid, job.id)) await companyRight(job.id, S.uid);
    await maybeMatch(job.id, S.uid);
  }
  return null;
}
async function companySwipe(jobId, seeker, dir) {
  if (dir === "left") await put("swipes", swipeId("company", seeker.id, jobId), { side: "company", seekerId: seeker.id, jobId, dir, at: now() });
  else {
    await companyRight(jobId, seeker.id);
    if (seeker.sample && seeker.autoLike && !sw("seeker", seeker.id, jobId))
      await put("swipes", swipeId("seeker", seeker.id, jobId), { side: "seeker", seekerId: seeker.id, jobId, dir: "right", at: now() });
    await maybeMatch(jobId, seeker.id);
  }
  return null;
}

function mountDeck(el, items, renderCard, onSwipe, emptyHtml) {
  let queue = items.slice(0, 2);
  if (!queue.length) { el.innerHTML = `<div class="panel emptydeck">${emptyHtml}</div>`; return; }
  el.innerHTML = `<div class="deckwrap"><div class="deck" id="deck"></div>
    <div class="swipebtns"><button class="nope" id="d-no" aria-label="Swipe left">✕</button><button class="like" id="d-yes" aria-label="Swipe right">♥</button></div>
    <p class="small muted">Drag the card, tap the buttons, or use ← →</p></div>`;
  const deck = $("#deck", el);
  deck.innerHTML = [...queue].reverse().map((it, i, arr) => `<article class="card ${i < arr.length - 1 ? "under" : "top"}" data-id="${h(it.id)}">
      <span class="stamp yes">Yes</span><span class="stamp no">Nope</span><div class="body">${renderCard(it)}</div></article>`).join("");
  const top = $(".card.top", deck); const item = items[0];
  let x0 = null, dx = 0, busy = false;
  const setX = (x, anim) => {
    top.style.transition = anim ? "transform .25s ease-out" : "none";
    top.style.transform = `translateX(${x}px) rotate(${x / 18}deg)`;
    $(".stamp.yes", top).style.opacity = Math.max(0, Math.min(1, x / 110));
    $(".stamp.no", top).style.opacity = Math.max(0, Math.min(1, -x / 110));
  };
  async function go_(dir) {
    if (busy) return; busy = true;
    setX(dir === "right" ? 640 : -640, true);
    await new Promise((r) => setTimeout(r, 230));
    const err = await onSwipe(item, dir); // the write re-renders the deck with the next card
    if (err) { toast(err); render(); }
  }
  top.addEventListener("pointerdown", (e) => { if (e.target.closest("button,select,input,a")) return; x0 = e.clientX; top.setPointerCapture(e.pointerId); });
  top.addEventListener("pointermove", (e) => { if (x0 === null) return; dx = e.clientX - x0; setX(dx, false); });
  const up = () => { if (x0 === null) return; x0 = null; if (dx > 110) go_("right"); else if (dx < -110) go_("left"); else setX(0, true); dx = 0; };
  top.addEventListener("pointerup", up); top.addEventListener("pointercancel", up);
  $("#d-no", el).onclick = () => go_("left");
  $("#d-yes", el).onclick = () => go_("right");
  UI.deckKeys = (k) => { if (k === "ArrowRight") go_("right"); if (k === "ArrowLeft") go_("left"); };
}

    const asSeeker = m.seekerId === S.uid; const s = D.seekers[m.seekerId] || {};
    return `<button class="item" data-m="${h(m.id)}"><div><b>${h(asSeeker ? m.job.companyName : `${s.first} ${s.last}`)}</b><p class="small muted">${asSeeker ? h(m.job.title) : `${h(s.headline)} · for ${h(m.job.title)}`}</p></div><span class="chip gold">Match</span></button>`;
  }).join("") || `<div class="panel"><p class="muted">No matches yet. A match happens when a company and a seeker both swipe right on the same job.</p></div>`}</div></div>`;
  app.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => { UI.openMatch = b.dataset.m; render(); }));
}
function matchChat(app, id) {
  const m = D.matches[id]; const j = D.jobs[m.jobId] || {}; const s = D.seekers[m.seekerId] || {};
  const asSeeker = m.seekerId === S.uid;
  const thread = Object.values(D.messages).filter((x) => x.matchId === id).sort((a, b) => a.at - b.at);
  const range = (a, b) => (a || b ? `${php(a)} – ${php(b)}` : "Not stated");
  app.innerHTML = `<div class="stack"><div><button class="btn ghost small" id="back">← All matches</button></div><div class="split">
    <aside class="panel stack">${asSeeker
      ? `<div class="row" style="flex-wrap:nowrap"><div class="logo-tile">${h((j.companyName || "?")[0])}</div><div><h3>${h(j.companyName)}</h3><p class="muted small">${h(j.title)}</p></div></div>
         <p><b>Salary:</b> ${range(j.salaryMin, j.salaryMax)} a month</p><p class="small" style="white-space:pre-line">${h(j.description)}</p>`
      : `<h3 style="font-size:24px">${h(s.first)} ${h(s.last)}</h3><p class="muted">${h(s.headline)} · ${s.totalYears} yrs</p>
         <p><b>Expected salary:</b> ${range(s.salaryMin, s.salaryMax)} a month</p>${s.email ? `<p><b>Email:</b> ${h(s.email)}</p>` : ""}
         <div class="chips">${(s.skills || []).map((k) => `<span class="chip">${h(k.label)} ${k.years} yrs</span>`).join("")}</div>
         ${s.resumeText ? `<pre class="resume">${h(s.resumeText)}</pre>` : ""}`}</aside>
    <section class="panel chat"><div class="msgs" id="msgs">${thread.map((x) => `<div class="msg ${x.from === S.uid ? "me" : ""}">${h(x.body)}</div>`).join("") || `<p class="muted small" style="text-align:center">It's a match! Say hello.</p>`}</div>
      <form class="row" id="send" style="flex-wrap:nowrap"><input class="in" id="msg-in" placeholder="Write a message" autocomplete="off" maxlength="2000"><button class="btn">Send</button></form></section></div></div>`;
  $("#back").onclick = () => { UI.openMatch = null; render(); };
  const ms = $("#msgs"); ms.scrollTop = ms.scrollHeight;
  $("#send").onsubmit = async (e) => {
    e.preventDefault(); const body = $("#msg-in").value.trim(); if (!body) return;
    $("#msg-in").value = ""; $("#msg-in").blur();
    await put("messages", newId(), { matchId: id, from: S.uid, body, at: now() });
    $("#msg-in")?.focus();
  };
}

/* ---------- Admin ---------- */
function viewAdmin(app) {
  if (!S.isOwner) { app.innerHTML = `<p class="panel muted">Only the Daliapply team can open the admin page.</p>`; return; }
  const pending = Object.entries(D.seekers).filter(([, s]) => s.verification === "pending");
  const payouts = Object.entries(D.payouts).filter(([, p]) => p.status === "requested");
  const unpaid = Object.entries(D.jobs).filter(([, j]) => !j.paid);
  app.innerHTML = `<div class="stack">
    <h2 style="font-size:30px">Admin</h2>
    <section class="stack"><h3>ID review queue (${pending.length})</h3>${pending.map(([id, s]) => `<div class="panel stack">
      <div class="row" style="justify-content:space-between"><div><b>${h(s.first)} ${h(s.last)}</b><p class="small muted">${h(s.idType)} · ${h(s.idFile || "no file name")} · ${h(s.email || "")}</p></div></div>
      <p class="small muted">Check the name matches the resume and the ID is valid and not expired.</p>
      <div class="row"><button class="btn small" data-ok="${h(id)}">Approve</button><input class="in" style="flex:1;min-width:160px" placeholder="Reason if rejecting" id="note-${h(id)}"><button class="btn ghost small" data-no="${h(id)}">Reject</button></div></div>`).join("") || `<p class="muted small">Nothing to review.</p>`}</section>
    <section class="stack"><h3>Cash-out requests (${payouts.length})</h3>${payouts.map(([id, p]) => { const s = D.seekers[p.seekerId] || {};
      return `<div class="panel row" style="justify-content:space-between"><span>${php(p.amount)} to ${h(p.method)} ${h(p.number)} · ${h(s.first)} ${h(s.last)}</span><span class="row"><button class="btn small" data-sent="${h(id)}">Mark sent</button><button class="btn ghost small" data-rej="${h(id)}">Reject</button></span></div>`; }).join("") || `<p class="muted small">None.</p>`}</section>
    <section class="stack"><h3>Jobs waiting for payment (${unpaid.length})</h3>${unpaid.map(([id, j]) => `<div class="panel row" style="justify-content:space-between"><span>${h(j.title)} · ${h(j.companyName)}</span><button class="btn small" data-paid="${h(id)}">Mark paid</button></div>`).join("") || `<p class="muted small">None.</p>`}</section>
  </div>`;
  app.querySelectorAll("[data-ok]").forEach((b) => (b.onclick = () => patch("seekers", b.dataset.ok, { verification: "verified", verifiedAt: now(), verificationNote: "" })));
  app.querySelectorAll("[data-no]").forEach((b) => (b.onclick = () => patch("seekers", b.dataset.no, { verification: "rejected", verificationNote: $("#note-" + CSS.escape(b.dataset.no)).value.trim() })));
  app.querySelectorAll("[data-sent]").forEach((b) => (b.onclick = () => patch("payouts", b.dataset.sent, { status: "sent", processedAt: now() })));
  app.querySelectorAll("[data-rej]").forEach((b) => (b.onclick = () => patch("payouts", b.dataset.rej, { status: "rejected", processedAt: now() })));
  app.querySelectorAll("[data-paid]").forEach((b) => (b.onclick = () => patch("jobs", b.dataset.paid, { paid: true, paidAt: now() })));
}

/* ============================================================ */
UI.route = ROUTES.includes(location.hash.slice(1)) ? location.hash.slice(1) : "home";
boot();
</script>
