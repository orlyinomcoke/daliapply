<style>
/* Layout: one narrow app column (max 980px), a top bar, and a swipe deck centred in each side's view. */
:root {

    --accent: #ffbf33; --accent-ink: #2a1c00; --primary: #8d9cff; --primary-ink: #0f1124; --soft: #23274a;
    --yes: #49d19f; --yes-soft: #12392c; --no: #ff7a85; --no-soft: #43181d; color-scheme: dark; --hero: #26318f;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1124; --surface: #191c35; --ink: #eef0fb; --muted: #a2a6c4; --line: #2b2f52;
  --accent: #ffbf33; --accent-ink: #2a1c00; --primary: #8d9cff; --primary-ink: #0f1124; --soft: #23274a;
  --yes: #49d19f; --yes-soft: #12392c; --no: #ff7a85; --no-soft: #43181d; color-scheme: dark; --hero: #26318f;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--display); font-stretch: 87%; line-height: 1.1; text-wrap: balance; margin: 0; letter-spacing: 0; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.logo { white-space: nowrap; font-family: var(--display); font-weight: 800; font-size: 22px; text-decoration: none; color: var(--ink); letter-spacing: -0.02em; }
.logo span { color: var(--primary); }
.logo i { font-style: normal; display: inline-block; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; margin-left: 2px; vertical-align: super; }
.toplinks { display: flex; gap: 4px; flex-wrap: wrap; }
.toplinks a { text-decoration: none; color: var(--ink); font-weight: 600; padding: 6px 10px; border-radius: 999px; font-size: 14px; }
.toplinks a[aria-current="page"] { background: var(--soft); }

.toplinks .login.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.toplinks button.out { border: 0; background: none; font-weight: 600; padding: 6px 10px; border-radius: 999px; cursor: pointer; color: var(--muted); }
.toplinks .who { font-size: 12px; color: var(--muted); align-self: center; padding: 0 6px; }
.narrow { display: none; }
.authtabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--bg); border-radius: 999px; }
.authtabs button { border: 0; background: none; border-radius: 999px; padding: 8px; font-weight: 700; cursor: pointer; color: var(--muted); }
.authtabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }

main { padding-block: 28px 64px; }

.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer; background: var(--primary); color: var(--primary-ink); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.ghost:hover { background: var(--soft); }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 14px; }

.muted { color: var(--muted); }
.small { font-size: 13px; }

.chip.yes { background: var(--yes-soft); color: var(--yes); }
.chip.no { background: var(--no-soft); color: var(--no); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.in { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 400; font-size: 15px; }
.in:focus { border-color: var(--primary); outline: none; }

.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.tabs button { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 14px; font-weight: 700; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.notice { border-radius: 14px; padding: 12px 14px; background: var(--soft); font-size: 14px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.notice.gold { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.err { color: var(--no); font-size: 13.5px; font-weight: 600; }
.tag-sample { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 1px 6px; }

/* Landing */
html, body { overflow-x: clip; }
body { margin: 0; }
.hero2 .blob-m { display: none; }
.hero2 { position: relative; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 32px; align-items: center; margin-top: -28px; padding: 64px 0 120px; color: #fff; isolation: isolate; }
.hero2 .blob { position: absolute; z-index: -1; top: 0; left: 50%; width: 100vw; height: 100%; transform: translateX(-50%); }
.hero2 .blob path { fill: var(--hero); }
.hero2 .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--hero-eyebrow); margin: 0 0 14px; }
.hero2 h1 { font-size: clamp(38px, 5.6vw, 64px); font-weight: 800; line-height: 1.02; max-width: 12ch; }
.hero2 h1 em { font-style: normal; background: linear-gradient(transparent 66%, var(--accent) 66% 90%, transparent 90%); }
.hero2 .lede { color: rgba(255,255,255,.82); font-size: 18px; max-width: 46ch; margin: 18px 0 26px; }
.hero2 .toggle { width: max-content; margin-bottom: 14px; border-color: transparent; }
.hero2 .toggle button { color: var(--ink); }
.hero2 .toggle button[aria-pressed="true"] { color: var(--primary-ink); }
.hero2 .bigsearch input { border-color: transparent; box-shadow: 0 18px 40px -20px rgba(0,0,0,.55); }
.hero2 .bigsearch input:focus { border-color: var(--accent); }
.hero-art { position: relative; height: 400px; }
.hero-art .hc { position: absolute; left: 50%; top: 50%; width: 270px; padding: 20px; border-radius: 22px; background: var(--surface); color: var(--ink); box-shadow: 0 30px 60px -30px rgba(0,0,0,.6); }
.hero-art .hc.b1 { transform: translate(-50%, -50%) rotate(-9deg) translate(-36px, 14px); opacity: .55; }
.hero-art .hc.b2 { transform: translate(-50%, -50%) rotate(6deg) translate(30px, 8px); opacity: .8; }
.hero-art .hc.top { transform: translate(-50%, -50%) rotate(-2deg); animation: bob 5s ease-in-out infinite; }
@keyframes bob { 50% { transform: translate(-50%, -54%) rotate(-1deg); } }
.hero-art .hc .tile { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 20px; margin-bottom: 12px; }
.hero-art .hc b { display: block; font-family: var(--display); font-size: 20px; line-height: 1.15; }
.hero-art .hc .meta { color: var(--muted); font-size: 14px; margin: 2px 0 12px; }
.hero-art .hc .fit { display: inline-block; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--yes-soft); color: var(--yes); }
.hero-art .hc .whyl { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 14px; }
.hero-art .stampy { position: absolute; top: 18px; right: 16px; padding: 2px 10px; border: 3px solid var(--yes); color: var(--yes); border-radius: 8px; font-family: var(--display); font-weight: 800; font-size: 18px; transform: rotate(12deg); }
.hero-art .pill { position: absolute; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; background: var(--surface); color: var(--ink); font-weight: 700; font-size: 14px; box-shadow: 0 16px 30px -18px rgba(0,0,0,.6); white-space: nowrap; }
.hero-art .pill .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-size: 13px; }
.hero-art .p1 { top: 14px; right: 0; }
.hero-art .p2 { bottom: 20px; left: 0; }
@media (max-width: 820px) {
  .hero2 { grid-template-columns: 1fr; padding: 40px 0 90px; gap: 8px; }
  .hero-art { height: 330px; }
  .hero2 .blob { display: none; }
  .hero2 .blob-m { display: block; }
  .hero-art .hc { width: 240px; }
  .hero2 .toggle { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .hero-art .hc.top { animation: none; } }
.hero { display: grid; gap: 28px; justify-items: center; text-align: center; padding-block: 40px 20px; }
.hero h1 { font-size: clamp(34px, 6vw, 60px); font-weight: 800; max-width: 14ch; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--accent) 62% 92%, transparent 92%); }
.hero .lede { color: var(--muted); max-width: 52ch; font-size: 17px; }
.toggle { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; }
.toggle .knob { position: absolute; inset: 4px auto 4px 4px; width: calc(50% - 4px); background: var(--primary); border-radius: 999px; transition: transform .3s cubic-bezier(.3,.7,.3,1); }
.toggle[data-side="company"] .knob { transform: translateX(100%); }
.toggle button { position: relative; z-index: 1; border: 0; background: none; padding: 9px 18px; font-weight: 700; cursor: pointer; border-radius: 999px; transition: color .3s; }
.toggle button[aria-pressed="true"] { color: var(--primary-ink); }
.bigsearch { width: min(680px, 100%); }
.bigsearch input { width: 100%; padding: 20px 22px; font-size: 18px; border-radius: 20px; border: 2px solid var(--line); background: var(--surface); box-shadow: 0 8px 30px -18px rgba(20,25,60,.35); }
.bigsearch input:focus { outline: none; border-color: var(--primary); }
.stepper { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; font-weight: 700; }
.stepper li { padding: 4px 12px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.stepper li[aria-current="step"] { background: var(--primary); color: var(--primary-ink); }
.recap { width: 100%; border-collapse: collapse; font-size: 15px; }
.recap th { text-align: left; vertical-align: top; color: var(--muted); font-weight: 600; width: 150px; padding: 8px 12px 8px 0; border-top: 1px solid var(--line); }

.foot { border-top: 1px solid var(--line); padding: 22px 0 40px; font-size: 14px; color: var(--muted); }

.btn.danger { color: var(--no); border-color: var(--no-soft); }
.sheet-bg { position: fixed; inset: 0; background: rgba(10,12,30,.45); z-index: 50; }
.sheet { position: fixed; z-index: 51; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; }
.paygrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; align-items: start; }
.qrimg { width: 100%; max-width: 300px; border-radius: 14px; align-self: center; }
.mailbox { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; background: var(--bg); }
.mailbox .mrow { display: flex; gap: 10px; font-size: 14px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }

@media (max-width: 760px) { .paygrid { grid-template-columns: 1fr; } }
.authgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 48px; align-items: start; max-width: 980px; margin: 0 auto; }
.pitch h2 { font-size: 34px; margin-bottom: 8px; }

.perks .num { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-weight: 800; font-size: 15px; }
.perks b { display: block; font-family: var(--display); font-size: 17px; }
.perks span.muted { font-size: 15px; }
@media (max-width: 820px) { .authgrid { grid-template-columns: 1fr; gap: 28px; } .authgrid .pitch { order: 2; } .pitch h2 { font-size: 26px; } }
.why-sec { margin-top: 56px; }

.why-sec > p { text-align: center; margin: 0 auto 28px; max-width: 560px; }
.why-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

.steps { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); counter-reset: st; }
.steps div { padding: 16px 0 0; border-top: 3px solid var(--ink); }

.steps b { font-family: var(--display); font-size: 18px; display: block; margin-bottom: 4px; }

.promises div { padding: 16px; border-top: 3px solid var(--ink); }

/* Deck */
.deckwrap { display: grid; gap: 14px; justify-items: center; }

.card { position: absolute; inset: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; touch-action: none; user-select: none; box-shadow: 0 18px 40px -26px rgba(20,25,60,.45); }
.card.under { transform: scale(.955) translateY(12px); opacity: .65; pointer-events: none; }

.card .stamp { position: absolute; top: 22px; padding: 4px 10px; border: 3px solid; border-radius: 8px; font-family: var(--display); font-weight: 800; font-size: 20px; text-transform: uppercase; opacity: 0; transform: rotate(-12deg); pointer-events: none; }
.card .stamp.yes { left: 18px; color: var(--yes); }
.card .stamp.no { right: 18px; color: var(--no); transform: rotate(12deg); }
.masked { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: .08em; }

.logo-tile { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 22px; background: var(--accent); color: var(--accent-ink); flex: none; }
.swipebtns { display: flex; gap: 22px; }

.swipebtns .nope { background: var(--no-soft); color: var(--no); }

.menu { position: absolute; right: 16px; top: 56px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; box-shadow: 0 12px 30px -14px rgba(0,0,0,.35); z-index: 3; }

async function pdfText(file) {
  if (!window.pdfjsLib) throw new Error("The PDF reader didn't load. Paste your resume text instead.");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  let out = "";
  for (let i = 1; i <= doc.numPages; i++) {
    const c = await (await doc.getPage(i)).getTextContent();

  }

  try {
    const [dbNs, userNs] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]);

  } catch { db = null; }

// A job is live once paid, until it's marked filled or its 30 days run out. Sample jobs never expire.
const liveUntil = (j) => j.liveUntil || (j.paidAt ? j.paidAt + CFG.jobLiveDays * DAY : null);
const isExpired = (j) => !j.sample && j.paid && liveUntil(j) && liveUntil(j) < now();
const isLive = (j) => j.paid && !j.filled && !j.takenDown && !isExpired(j);
function isHidden(seekerId, companyId) { const h = D.hidden[`${seekerId}_${companyId}`]; return h && h.until > now(); }
function rightSwipesToday(seekerId) {
  return Object.values(D.swipes).filter((x) => x.side === "seeker" && x.seekerId === seekerId && x.dir === "right" && x.at > now() - DAY).length;
}
function seekerFeed() {
  const s = me(); if (!s) return [];
  return Object.entries(D.jobs).map(([id, j]) => ({ id, ...j }))
    .filter((j) => isLive(j) && !sw("seeker", S.me, j.id))
    .filter((j) => (sw("company", S.me, j.id) || {}).dir !== "left")
    .filter((j) => !isHidden(S.me, j.companyId))
    .filter((j) => passes(s, j))
    .sort((a, b) => score(s, b) - score(s, a) || (b.createdAt || 0) - (a.createdAt || 0));
}
function candidates(jobId, filters) {
  const j = D.jobs[jobId]; if (!j) return [];
  return Object.entries(D.seekers).map(([id, s]) => ({ id, ...s }))
    .filter((s) => s.confirmed)
    .filter((s) => !sw("company", s.id, jobId))
    .filter((s) => (sw("seeker", s.id, jobId) || {}).dir !== "left")
    .filter((s) => !isHidden(s.id, j.companyId))
    .filter((s) => passes(s, j))
    .filter((s) => roleMatches(s.headline, filters.role))
    .filter((s) => filters.skills.every((k) => (s.skills || []).some((x) => x.label.toLowerCase() === k.label.toLowerCase())))
    .map((s) => ({ ...s, _score: score(s, j) + (filters.skills.length ? filters.skills.reduce((a, k) => a + Math.min(yearsFor(s, k.label) / Math.max(k.min, 0.5), 1), 0) / filters.skills.length : 0) }))
    .sort((a, b) => b._score - a._score);
}

async function maybeMatch(jobId, seekerId) {
  if ((sw("seeker", seekerId, jobId) || {}).dir === "right" && (sw("company", seekerId, jobId) || {}).dir === "right" && !D.matches[matchId(jobId, seekerId)]) {
    await put("matches", matchId(jobId, seekerId), { jobId, seekerId, at: now() });
    const j = D.jobs[jobId];
    if (seekerId === S.me || (j && j.companyId === S.me)) showMatch(jobId, seekerId);
  }
}
async function companyRight(jobId, seekerId) {
  await put("swipes", swipeId("company", seekerId, jobId), { side: "company", seekerId, jobId, dir: "right", at: now() });
}
async function seekerSwipe(job, dir) {
  if (dir === "right" && rightSwipesToday(S.me) >= CFG.dailyRightSwipes) return `You've used today's ${CFG.dailyRightSwipes} right swipes. Left swipes still work.`;
  await put("swipes", swipeId("seeker", S.me, job.id), { side: "seeker", seekerId: S.me, jobId: job.id, dir, at: now() });
  if (dir === "right") {
    // Sample companies answer instantly so you can see a match.
    if (job.sample && job.autoLike && !sw("company", S.me, job.id)) await companyRight(job.id, S.me);
    await maybeMatch(job.id, S.me);
  }
  return null;
}
async function companySwipe(jobId, seeker, dir) {
  if (dir === "left") await put("swipes", swipeId("company", seeker.id, jobId), { side: "company", seekerId: seeker.id, jobId, dir, at: now() });
  else {
    await companyRight(jobId, seeker.id);
    if (seeker.sample && seeker.autoLike && !sw("seeker", seeker.id, jobId))
      await put("swipes", swipeId("seeker", seeker.id, jobId), { side: "seeker", seekerId: seeker.id, jobId, dir: "right", at: now() });
    await maybeMatch(jobId, seeker.id);
  }
  return null;
}

/* Swipe deck: drag, buttons or arrow keys */
function mountDeck(el, items, renderCard, onSwipe, emptyHtml) {
  let queue = items.slice(0, 2);
  if (!queue.length) { el.innerHTML = `<div class="panel emptydeck">${emptyHtml}</div>`; return; }
  el.innerHTML = `<div class="deckwrap"><div class="deck" id="deck"></div>
    <div class="swipebtns"><button class="nope" id="d-no" aria-label="Swipe left">✕</button><button class="like" id="d-yes" aria-label="Swipe right">♥</button></div>
    <p class="small muted">Drag the card, tap the buttons, or use ← →</p></div>`;
  const deck = $("#deck", el);
  deck.innerHTML = [...queue].reverse().map((it, i, arr) => `<article class="card ${i < arr.length - 1 ? "under" : "top"}" data-id="${h(it.id)}">
      <span class="stamp yes">Yes</span><span class="stamp no">Nope</span><div class="body">${renderCard(it)}</div></article>`).join("");
  const top = $(".card.top", deck); const item = items[0];
  let x0 = null, dx = 0, busy = false;
  const setX = (x, anim) => {
    top.style.transition = anim ? "transform .25s ease-out" : "none";
    top.style.transform = `translateX(${x}px) rotate(${x / 18}deg)`;
    $(".stamp.yes", top).style.opacity = Math.max(0, Math.min(1, x / 110));
    $(".stamp.no", top).style.opacity = Math.max(0, Math.min(1, -x / 110));
  };
  async function go_(dir) {
    if (busy) return; busy = true;
    setX(dir === "right" ? 640 : -640, true);
    await new Promise((r) => setTimeout(r, 230));
    const err = await onSwipe(item, dir); // the write re-renders the deck with the next card
    if (err) { toast(err); render(); }
  }
  top.addEventListener("pointerdown", (e) => { if (e.target.closest("button,select,input,a")) return; x0 = e.clientX; top.setPointerCapture(e.pointerId); });
  top.addEventListener("pointermove", (e) => { if (x0 === null) return; dx = e.clientX - x0; setX(dx, false); });
  const up = () => { if (x0 === null) return; x0 = null; if (dx > 110) go_("right"); else if (dx < -110) go_("left"); else setX(0, true); dx = 0; };
  top.addEventListener("pointerup", up); top.addEventListener("pointercancel", up);
  $("#d-no", el).onclick = () => go_("left");
  $("#d-yes", el).onclick = () => go_("right");
  UI.deckKeys = (k) => { if (k === "ArrowRight") go_("right"); if (k === "ArrowLeft") go_("left"); };
}

  const matchIds = Object.keys(D.matches).filter((k) => (side === "seeker" ? D.matches[k].seekerId === id : jobs.includes(D.matches[k].jobId)));
  const jobs$ = new Set(jobs), matches$ = new Set(matchIds);
  const gone = [
    ...Object.keys(D.messages).filter((k) => matches$.has(D.messages[k].matchId)).map((k) => ["messages", k]),
    ...matchIds.map((k) => ["matches", k]),
    ...Object.keys(D.swipes).filter((k) => (side === "seeker" ? D.swipes[k].seekerId === id : jobs$.has(D.swipes[k].jobId))).map((k) => ["swipes", k]),
    ...Object.keys(D.hidden).filter((k) => (side === "seeker" ? D.hidden[k].seekerId === id : D.hidden[k].companyId === id)).map((k) => ["hidden", k]),
    ...jobs.map((k) => ["jobs", k]),
    [side === "seeker" ? "seekers" : "companies", id],
  ];
  for (const [c, k] of gone) await del(c, k);
  // payment records stay (tax), stripped of the receipt image
  for (const k of Object.keys(D.payments).filter((k) => D.payments[k].companyId === id)) await patch("payments", k, { proof: null, accountDeleted: true });
  setRole(null); UI.openJob = null; UI.openMatch = null; go("home"); toast("Your account has been deleted.");
}

const JOB_COUNTRIES = ["PH","SG","HK","JP","KR","TW","MY","ID","TH","VN","IN","AE","SA","QA","KW","BH","OM","AU","NZ","US","CA","GB","IE","DE","NL","FR","ES","IT"];
const countryName = (() => { let dn = null; try { dn = new Intl.DisplayNames(["en"], { type: "region" }); } catch {} return (c) => (dn ? dn.of(c) : c) || c; })();
const KNOWN_SKILLS = new Set(Object.keys(SKILLS).map((k) => k.toLowerCase()));
function parseSkillLines(text) {
  const out = [], bad = [];
  text.split("\n").map((l) => l.trim()).filter(Boolean).forEach((l) => {
    const m = l.match(/^(.+?)[\s:,-]+(\d+(?:\.\d+)?)\s*\+?\s*(?:yrs?|years?)?$/i);
    if (m && m[1].trim()) out.push({ label: m[1].trim(), min: +m[2] }); else bad.push(l);
  });
  return { skills: out, bad };
}
// Skills and years the description mentions, sentence by sentence ("5+ years of PHP").
function descSkills(desc) {
  const found = {};
  desc.split(/[\n.;•,]+|\band\b/i).forEach((part) => {
    if (!part.trim()) return;
    parseSearch(part).skills.forEach((k) => { if (!found[k.label] || k.min > found[k.label]) found[k.label] = k.min; });
  });
  return Object.entries(found).map(([label, min]) => ({ label, min }));
}
function editDistance(a, b) {
  const m = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) m[i][j] = Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return m[a.length][b.length];
}
function closestSkill(label) {
  const l = label.toLowerCase(); let best = null;
  for (const k of Object.keys(SKILLS)) { const d = editDistance(l, k.toLowerCase()); if (d <= Math.max(1, Math.floor(k.length / 4)) && (!best || d < best.d)) best = { k, d }; }
  return best ? best.k : null;
}
function jobChecks(d) {
  const out = []; const req = Object.fromEntries(d.skills.map((k) => [k.label.toLowerCase(), k]));
  for (const k of descSkills(d.description)) {
    const r = req[k.label.toLowerCase()];
    if (r && k.min && r.min !== k.min) out.push({ kind: "years", text: `Your description says ${k.label} ${k.min} years, but required skills say ${r.min}. Which is right?`, fix: { label: r.label, min: k.min }, fixText: `Use ${k.min} years` });
    else if (!r) out.push({ kind: "missing", text: `Your description mentions ${k.label}, but it isn't in your required skills, so we won't match on it.`, fix: { label: k.label, min: k.min || 1, add: true }, fixText: `Add ${k.label}${k.min ? ` (${k.min} yrs)` : ""}` });
  }
  d.skills.forEach((k) => {
    if (!KNOWN_SKILLS.has(k.label.toLowerCase())) {
      const near = closestSkill(k.label);
      out.push(near ? { kind: "unknown", text: `We don't recognise "${k.label}". Did you mean ${near}?`, fix: { label: k.label, min: k.min, rename: near }, fixText: `Change to ${near}` }
        : { kind: "unknown", text: `We don't recognise "${k.label}". Check the spelling, or seekers' resumes may not match it.` });
    }
    if (k.min > 20) out.push({ kind: "years", text: `${k.label} ${k.min} years is a lot. Very few people will match. Is that a typo?` });
  });
  if (d.salaryMin < 10000) out.push({ kind: "salary", text: `${php(d.salaryMin)} a month is unusually low. Is it a typo (for example, a missing zero)?` });
  if (d.salaryMax > 1000000) out.push({ kind: "salary", text: `${php(d.salaryMax)} a month is unusually high. Is it a typo?` });
  if (d.salaryMax > d.salaryMin * 3) out.push({ kind: "salary", text: `The top of your salary range is more than 3 times the bottom. Seekers trust a tighter range more.` });
  return out;
}

function jobStatus(j) {
  if (j.takenDown) return "Taken down after a report. Contact support.";
  if (j.filled) return "Position filled";
  if (isExpired(j)) return "Expired. Renew to show it again.";
  if (j.paid) { const left = liveUntil(j) ? Math.max(1, Math.ceil((liveUntil(j) - now()) / DAY)) : null; return left ? `Live · ${left} day${left === 1 ? "" : "s"} left` : "Live"; }

  if (j.payStatus === "rejected") return "Payment not confirmed, please send again";

}
// Shrink a photo of the receipt so it fits in the shared database.
function shrinkImage(file, max = 1000, q = 0.72) {
  return new Promise((ok, bad) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", q)); };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error("not an image")); };
    img.src = url;
  });
}

      : j.filled ? "You marked this position as filled, so seekers no longer see it." : `This post expired on ${h(stamp(liveUntil(j)))}. Seekers no longer see it.`;
    app.innerHTML = `<div class="stack">${head}<div class="panel stack" style="max-width:640px"><h3>${j.takenDown ? "Taken down" : j.filled ? "Position filled" : "Expired"}</h3><p class="muted">${why}</p>
      ${j.takenDown ? `<a class="btn ghost" href="#support">Contact support</a>` : `<div class="row"><button class="btn" id="renew">Renew for ${CFG.jobLiveDays} days · ${PRICE}</button>${j.filled ? `<button class="btn ghost" id="reopen-free" ${isExpired(j) ? "hidden" : ""}>Reopen (still within 30 days)</button>` : ""}</div>`}
      <p class="small muted">Your matches and chats stay in Matches.</p></div></div>`;
    $("#back").onclick = () => { UI.openJob = null; render(); };
    if ($("#renew")) $("#renew").onclick = async () => { await patch("jobs", jobId, { paid: false, payStatus: null, filled: false, renewal: true }); toast("Pay to put this job back up for another 30 days."); };
    if ($("#reopen-free")) $("#reopen-free").onclick = async () => { await patch("jobs", jobId, { filled: false }); toast("Your job is live again."); };
    return;
  }
  const f = UI.filters; const list = candidates(jobId, f);
  app.innerHTML = `<div class="stack">${head}
    <div class="row small" style="justify-content:space-between"><span class="muted">${h(jobStatus(j))}</span><button class="btn ghost small" id="filled">Position filled</button></div>
    <form id="cs"><div class="bigsearch" style="width:100%"><input id="cs-q" value="${h(f.q)}" placeholder="Who are you looking for? e.g. programmer with 5 years in management and PHP" autocomplete="off"></div></form>
    <div class="chips">${f.role ? `<button class="chip" data-rm="role">Role: ${h(f.role)} ×</button>` : ""}${f.skills.map((k, i) => `<button class="chip" data-rm="${i}">${h(k.label)}${k.min ? ` ${k.min}+ yrs` : ""} ×</button>`).join("")}</div>
    <div id="deckbox"></div></div>`;
  $("#back").onclick = () => { UI.openJob = null; render(); };
  $("#filled").onclick = async (e) => {
    if (e.target.dataset.sure !== "1") { e.target.dataset.sure = "1"; e.target.textContent = "Tap again to close this job"; return; }
    await patch("jobs", jobId, { filled: true, filledAt: now() }); toast("Marked as filled. Seekers won't see this job any more.");
  };
  $("#cs").onsubmit = (e) => { e.preventDefault(); const q = $("#cs-q").value.trim(); const p = parseSearch(q); UI.filters = { q, role: p.role, skills: p.skills }; render(); };
  app.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = () => { const k = b.dataset.rm; if (k === "role") f.role = null; else f.skills.splice(+k, 1); render(); }));
  mountDeck($("#deckbox"), list, (s) => seekerCard(s, j), (s, dir) => companySwipe(jobId, s, dir),
    `<h3>No more candidates for this job.</h3><p class="muted" style="margin-top:6px">${f.skills.length || f.role ? "Remove a filter above to see more." : "New seekers appear here as they join."}</p>`);
}
function seekerCard(s, j) {
  return `<p class="small muted">${s.sample ? '<span class="tag-sample">Sample</span> ' : ""}${s.verification === "verified" ? '<span class="chip yes">✓ Verified</span>' : ""}</p>
    <p class="masked" aria-label="Name hidden until a match">${h(mask(s.first, s.last))}</p>
    <p class="muted">${h(s.headline)} · ${s.totalYears} yrs total</p>
    <div class="chips">${(s.skills || []).slice(0, 8).map((k) => `<span class="chip">${h(k.label)} ${k.years} yrs</span>`).join("")}</div>
    ${(s.recentRoles || []).length ? `<div class="small">${s.recentRoles.slice(0, 3).map((r) => `<div>${h(r.title)} · ${r.years} yrs</div>`).join("")}</div>` : ""}
    <div class="chips">${s.country ? `<span class="chip">${h(s.country)}</span>` : ""}${(s.languages || []).map((l) => `<span class="chip" style="text-transform:capitalize">${h(l)}</span>`).join("")}
      <span class="chip yes">Within your budget</span></div>
    <div class="why"><b>Why it matched</b>${h(whyLine(s, j)) || "Fits your country, languages and budget"}</div>`;
}

/* ---------- Matches and chat ---------- */
const dayKey = (t) => new Date(t).toDateString();
function dayLabel(t) {
  const d = new Date(t), today = new Date(), y = new Date(Date.now() - DAY);
  if (dayKey(t) === today.toDateString()) return "Today";
  if (dayKey(t) === y.toDateString()) return "Yesterday";
  return d.toLocaleDateString("en-PH", { month: "short", day: "numeric", year: d.getFullYear() === today.getFullYear() ? undefined : "numeric" });
}
const clock = (t) => new Date(t).toLocaleTimeString("en-PH", { hour: "numeric", minute: "2-digit" });
const stamp = (t) => `${dayLabel(t)}, ${clock(t)}`;
/* Which side wrote a message. One account can hold both a seeker and a company profile,
   so the side is stored on each message; older messages fall back to the account id. */
function isMine(x) { return x.fromSide ? x.fromSide === S.role : x.from === S.me; }
function lastMessage(matchId) {
  let last = null; for (const x of Object.values(D.messages)) if (x.matchId === matchId && (!last || x.at > last.at)) last = x;
  return last;
}
function myMatches() {
  return Object.entries(D.matches).map(([id, m]) => ({ id, ...m, job: D.jobs[m.jobId] || {} }))
    .filter((m) => (S.role === "seeker" ? m.seekerId === S.me : m.job.companyId === S.me)).sort((a, b) => b.at - a.at);
}
function viewMatches(app) {
  if (UI.openMatch && D.matches[UI.openMatch]) return matchChat(app, UI.openMatch);
  // newest conversation first: last message time, or the match time when nobody has written yet
  const ms = myMatches().map((m) => ({ ...m, last: lastMessage(m.id) })).sort((a, b) => (b.last?.at || b.at) - (a.last?.at || a.at));
  app.innerHTML = `<div class="stack"><h2 style="font-size:30px">Matches</h2><div class="list">${ms.map((m) => {
    const asSeeker = S.role === "seeker"; const s = D.seekers[m.seekerId] || {};
    const sub = asSeeker ? h(m.job.title) : `${h(s.headline)} · for ${h(m.job.title)}`;
    const preview = m.last ? `${isMine(m.last) ? "You: " : ""}${h(m.last.body)}` : `<span class="chip gold">New match</span> Say hello`;
    return `<button class="item" data-m="${h(m.id)}"><div style="flex:1"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${h(asSeeker ? m.job.companyName : `${s.first} ${s.last}`)}</b><span class="when">${stamp(m.last?.at || m.at)}</span></div>
      <p class="small muted">${sub}</p><p class="small preview">${preview}</p></div></button>`;
  }).join("") || `<div class="panel"><p class="muted">No matches yet. A match happens when a company and a seeker both swipe right on the same job.</p></div>`}</div></div>`;
  app.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => { UI.openMatch = b.dataset.m; render(); }));
}
function bindReportPerson(id) {
  const m = D.matches[id]; const j = D.jobs[m.jobId] || {}; const sk = D.seekers[m.seekerId] || {};
  const b = $("#report-person"); if (!b) return;
  b.onclick = () => openReport(S.role === "seeker"
    ? { kind: "company", jobId: m.jobId, companyId: j.companyId, matchId: id, label: `${j.companyName} (${j.title})` }
    : { kind: "seeker", seekerId: m.seekerId, matchId: id, label: `${sk.first} ${sk.last}` });
}
function matchChat(app, id) {
  const m = D.matches[id]; const j = D.jobs[m.jobId] || {}; const s = D.seekers[m.seekerId] || {};
  const asSeeker = S.role === "seeker";
  const thread = Object.values(D.messages).filter((x) => x.matchId === id).sort((a, b) => a.at - b.at);
  const range = (a, b) => (a || b ? `${php(a)} – ${php(b)} a month` : "Not stated");
  app.innerHTML = `<div class="stack"><div class="row" style="justify-content:space-between"><button class="btn ghost small" id="back">← All matches</button><button class="btn ghost small" id="report-person">Report ${asSeeker ? "this company" : "this person"}</button></div><div class="split">
    <aside class="panel stack">${asSeeker
      ? `<div class="row" style="flex-wrap:nowrap"><div class="logo-tile">${h((j.companyName || "?")[0])}</div><div><h3>${h(j.companyName)}</h3><p class="muted small">${h(j.title)}</p></div></div>
         <p><b>Salary:</b> ${range(j.salaryMin, j.salaryMax)}</p><p class="small" style="white-space:pre-line">${h(j.description)}</p>`
      : `<h3 style="font-size:24px">${h(s.first)} ${h(s.last)}</h3><p class="muted">${h(s.headline)} · ${s.totalYears} yrs</p>
         <p><b>Expected salary:</b> ${range(s.salaryMin, s.salaryMax)}</p>${s.email ? `<p><b>Email:</b> ${h(s.email)}</p>` : ""}
         <div class="chips">${(s.skills || []).map((k) => `<span class="chip">${h(k.label)} ${k.years} yrs</span>`).join("")}</div>
         ${s.resumeText ? `<pre class="resume">${h(s.resumeText)}</pre>` : ""}`}</aside>
    <section class="panel chat"><div class="msgs" id="msgs"><p class="daysep">Matched ${stamp(m.at)}</p>${thread.map((x, i) => `${i === 0 || dayKey(x.at) !== dayKey(thread[i - 1].at) ? `<p class="daysep">${dayLabel(x.at)}</p>` : ""}<div class="msgrow ${isMine(x) ? "me" : ""}"><div class="msg">${h(x.body)}</div><time datetime="${new Date(x.at).toISOString()}">${clock(x.at)}</time></div>`).join("") || `<p class="muted small" style="text-align:center">It's a match! Say hello.</p>`}</div>
      <form class="row" id="send" style="flex-wrap:nowrap"><input class="in" id="msg-in" placeholder="Write a message" autocomplete="off" maxlength="2000"><button class="btn">Send</button></form></section></div></div>`;
  $("#back").onclick = () => { UI.openMatch = null; render(); };
  bindReportPerson(id);
  const ms = $("#msgs"); ms.scrollTop = ms.scrollHeight;
  $("#send").onsubmit = async (e) => {
    e.preventDefault(); const body = $("#msg-in").value.trim(); if (!body) return;
    $("#msg-in").value = ""; $("#msg-in").blur();
    await put("messages", newId(), { matchId: id, from: S.me, fromSide: S.role, body, at: now() });
    $("#msg-in")?.focus();
  };
}

/* ---------- Admin ---------- */
function viewAdmin(app) {
  if (!S.isOwner) { app.innerHTML = `<p class="panel muted">Only the Daliapply team can open the admin page.</p>`; return; }
  const pending = Object.entries(D.seekers).filter(([, s]) => s.verification === "pending");
  const unpaid = Object.entries(D.jobs).filter(([, j]) => !j.paid && j.payStatus !== "submitted");
  const inbox = Object.entries(D.payments).filter(([, p]) => p.status === "submitted").sort((a, b) => a[1].at - b[1].at);
  const reports = Object.entries(D.reports).filter(([, r]) => r.status === "open").sort((a, b) => a[1].at - b[1].at);
  const tickets = Object.entries(D.support).filter(([, t]) => t.status !== "closed").sort((a, b) => a[1].at - b[1].at);
  app.innerHTML = `<div class="stack">
    <h2 style="font-size:30px">Admin</h2>
    <section class="stack"><h3>ID review queue (${pending.length})</h3>${pending.map(([id, s]) => `<div class="panel stack">
      <div class="row" style="justify-content:space-between"><div><b>${h(s.first)} ${h(s.last)}</b><p class="small muted">${h(s.idType)} · ${h(s.idFile || "no file name")} · ${h(s.email || "")}</p></div></div>
      <p class="small muted">Check the name matches the resume and the ID is valid and not expired.</p>
      <div class="row"><button class="btn small" data-ok="${h(id)}">Approve</button><input class="in" style="flex:1;min-width:160px" placeholder="Reason if rejecting" id="note-${h(id)}"><button class="btn ghost small" data-no="${h(id)}">Reject</button></div></div>`).join("") || `<p class="muted small">Nothing to review.</p>`}</section>
    <section class="stack"><h3>Reports (${reports.length})</h3>${reports.map(([id, r]) => `<div class="panel stack">
      <div><b>${h(r.reason)}</b> · <span class="small muted">${h(r.kind)}: ${h(r.label)} · by a ${h(r.bySide)} · ${h(stamp(r.at))}</span></div>
      ${r.note ? `<p class="small">${h(r.note)}</p>` : ""}
      <div class="row">${r.jobId ? `<button class="btn small" data-takedown="${h(id)}">Take the job down</button>` : ""}<input class="in" style="flex:1;min-width:160px" placeholder="Note to the company (if taking down)" id="rnote-${h(id)}"><button class="btn ghost small" data-dismiss="${h(id)}">Dismiss</button></div></div>`).join("") || `<p class="muted small">No open reports.</p>`}</section>
    <section class="stack"><h3>Support messages (${tickets.length})</h3>${tickets.map(([id, t]) => `<div class="panel stack">
      <div><b>${h(t.topic)}</b> · <span class="small muted">${h(t.email)} · ${h(t.side || "visitor")} · ${h(stamp(t.at))}</span></div>
      <p class="small" style="white-space:pre-wrap">${h(t.body)}</p>
      <div class="row"><a class="btn small" href="mailto:${h(t.email)}?subject=${encodeURIComponent("Re: " + t.topic)}">Reply by email</a><button class="btn ghost small" data-closet="${h(id)}">Mark done</button></div></div>`).join("") || `<p class="muted small">No open messages.</p>`}</section>
    <section class="stack"><h3>Sales inbox: payments to check (${inbox.length})</h3>${inbox.map(([id, p]) => `<div class="panel stack">
      <div><b>${h(p.subject)}</b><p class="small muted">To ${h(p.to)} · ${h(stamp(p.at))} · Ref ${h(p.ref || "none")} · ${h("₱" + (+p.amount).toLocaleString("en-PH"))}</p></div>
      <div class="paygrid"><pre class="resume">${h(p.body)}</pre>${p.proof ? `<img src="${p.proof}" alt="Payment receipt" style="max-width:100%;max-height:360px;border-radius:12px">` : "<p class='muted small'>No receipt attached.</p>"}</div>
      <div class="row"><button class="btn small" data-payok="${h(id)}">Payment received, publish job</button><input class="in" style="flex:1;min-width:160px" placeholder="Reason if rejecting" id="pnote-${h(id)}"><button class="btn ghost small" data-payno="${h(id)}">Reject</button></div></div>`).join("") || `<p class="muted small">No payments to check.</p>`}</section>
    <section class="stack"><h3>Jobs waiting for payment (${unpaid.length})</h3>${unpaid.map(([id, j]) => `<div class="panel row" style="justify-content:space-between"><span>${h(j.title)} · ${h(j.companyName)}</span><button class="btn small" data-paid="${h(id)}">Mark paid</button></div>`).join("") || `<p class="muted small">None.</p>`}</section>
  </div>`;
  app.querySelectorAll("[data-ok]").forEach((b) => (b.onclick = () => patch("seekers", b.dataset.ok, { verification: "verified", verifiedAt: now(), verificationNote: "", idFile: "", idDeletedAt: now() })));
  app.querySelectorAll("[data-no]").forEach((b) => (b.onclick = () => patch("seekers", b.dataset.no, { verification: "rejected", verificationNote: $("#note-" + CSS.escape(b.dataset.no)).value.trim(), idFile: "", idDeletedAt: now() })));
  app.querySelectorAll("[data-paid]").forEach((b) => (b.onclick = () => patch("jobs", b.dataset.paid, { paid: true, paidAt: now(), liveUntil: now() + CFG.jobLiveDays * DAY, filled: false })));
  app.querySelectorAll("[data-takedown]").forEach((b) => (b.onclick = async () => { const r = D.reports[b.dataset.takedown];
    await patch("jobs", r.jobId, { takenDown: true, takedownNote: $("#rnote-" + CSS.escape(b.dataset.takedown)).value.trim() }); await patch("reports", b.dataset.takedown, { status: "actioned", reviewedAt: now() }); toast("Job taken down."); }));
  app.querySelectorAll("[data-dismiss]").forEach((b) => (b.onclick = () => patch("reports", b.dataset.dismiss, { status: "dismissed", reviewedAt: now() })));
  app.querySelectorAll("[data-closet]").forEach((b) => (b.onclick = () => patch("support", b.dataset.closet, { status: "closed", closedAt: now() })));
  app.querySelectorAll("[data-payok]").forEach((b) => (b.onclick = async () => { const p = D.payments[b.dataset.payok];
    await patch("payments", b.dataset.payok, { status: "approved", reviewedAt: now() }); await patch("jobs", p.jobId, { paid: true, paidAt: now(), liveUntil: now() + CFG.jobLiveDays * DAY, payStatus: "approved", filled: false }); toast("Job published."); }));
  app.querySelectorAll("[data-payno]").forEach((b) => (b.onclick = async () => { const p = D.payments[b.dataset.payno];
    await patch("payments", b.dataset.payno, { status: "rejected", note: $("#pnote-" + CSS.escape(b.dataset.payno)).value.trim(), reviewedAt: now() }); await patch("jobs", p.jobId, { payStatus: "rejected" }); toast("Payment rejected. The company will see your reason."); }));
}

/* ============================================================ */
UI.route = ROUTES.includes(location.hash.slice(1)) ? location.hash.slice(1) : "home";
boot();
</script>
